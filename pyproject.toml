[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meicosta82-asr_jd024"
version = "0.1.0"
description = "把候选项映射到类别上，算出语音识别算法工程师·敏感信息的脱敏与回填的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "meicosta82" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://meicosta82.github.io"
Repository = "https://github.com/meicosta82/asr_jd024"
Issues = "https://github.com/meicosta82/asr_jd024/issues"

[project.scripts]
asr_jd024 = "asr_jd024:main"

[tool.setuptools]
py-modules = ["asr_jd024"]
